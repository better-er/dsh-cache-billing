name: Release

# 推送形如 vX.Y.Z 的 tag 时自动发版：
#   凭 tag 号更新 package.json 版本并提交回 main → 构建 → 发布 npm → 生成 GitHub Release 草稿。
#   人只需打一个 tag，其余自动衔接。
# 注意：npm 发布走 Trusted Publishing，无需 NPM_TOKEN；未在 npm 侧绑定信任关系时发布会失败。
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: ubuntu-latest
    environment: release
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
        with:
          # 回写 main 需要完整历史，故拉全量。
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      # 前置守卫：仅当该 tag 版本尚未发布到 npm 时才继续发版。
      # 补历史 tag 时对应版本早已在 npm 上，重复 publish 会报错，且版本回写会把 main 改回旧号，
      # 故已发布则跳过后续所有步骤。npm view 只读 registry，无需凭证。
      - name: Skip when tag version already published
        id: published
        run: |
          set -euo pipefail
          PKG="dsh-cache-billing"
          TAG="${GITHUB_REF_NAME#v}"
          if npm view "$PKG@$TAG" version >/dev/null 2>&1; then
            echo "已存在 $PKG@$TAG，跳过发布"
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "未发布 $PKG@$TAG，继续"
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # 版本号仅凭 tag 号决定，写入 package.json 并提交回 main。
      - name: Sync version to main
        if: steps.published.outputs.published != 'true'
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME#v}"
          echo "target version = $TAG"

          # 切到 main 分支再改版本，避免在 detached tag 上提交。
          git checkout main
          git config user.name  github-actions[bot]
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # 用临时文件改写 version 字段，保留其余内容不变。
          node -e "
            const fs = require('fs');
            const p = require('./package.json');
            p.version = process.argv[1];
            fs.writeFileSync('./package.json', JSON.stringify(p, null, 2) + '\n');
          " "$TAG"

          # 已是最新版本则无改动，跳过提交；否则提交并推回 main。
          git diff --quiet package.json || {
            git add package.json
            git commit -m "chore: release $TAG 同步 package.json 版本 [skip ci]"
            git push origin main
          }

      - uses: pnpm/action-setup@v4
        if: steps.published.outputs.published != 'true'
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        if: steps.published.outputs.published != 'true'
        with:
          # node >= 24 捆绑的 npm >= 11.5.1，npm CLI 才能做 Trusted Publishing 的 OIDC 自动换权；
          # 低于该版本 npm 不会去换临时凭证，发布会退化成普通未登录而报 ENEEDAUTH。
          # registry-url 告知 npm 向哪个 registry 换 Trusted Publishing 临时凭证，二者缺一不可。
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - name: Install dependencies
        if: steps.published.outputs.published != 'true'
        run: pnpm install --frozen-lockfile
      - name: Build
        if: steps.published.outputs.published != 'true'
        run: pnpm run build
      - name: Publish to npm
        if: steps.published.outputs.published != 'true'
        run: pnpm publish --no-git-checks --provenance --access public
      - uses: softprops/action-gh-release@v2
        if: steps.published.outputs.published != 'true'
        with:
          draft: true
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
